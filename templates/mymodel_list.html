{% load static %} <!-- 1. Подключаем статику -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Список MyModel</title>
    <!-- 2. Исправляем пути к CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">Список MyModel</h1>
    <a href="{% url 'students:mymodel_create' %}" class="btn btn-primary mb-3">Создать новый MyModel</a>

    <ul class="list-group">
       <!-- ИСПОЛЬЗУЕМ object_list (стандартное имя Django для ListView) -->
       {% for mymodel in object_list %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <a href="{% url 'students:mymodel_detail' mymodel.pk %}" class="me-3">{{ mymodel.name }}</a>
            </div>
            <div>
                <a href="{% url 'students:mymodel_update' mymodel.pk %}" class="btn btn-secondary btn-sm me-2">Редактировать</a>
                <a href="{% url 'students:mymodel_delete' mymodel.pk %}" class="btn btn-danger btn-sm">Удалить</a>
            </div>
        </li>
       {% empty %}
        <!-- Если список пуст, выведется это сообщение -->
        <li class="list-group-item text-muted">Записей пока нет. Создайте первую!</li>
       {% endfor %}
    </ul>
</div>

<!-- 3. Исправляем пути к JS -->
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
