name: Django CI

on: [push, pull_request]

jobs:
  # 1. Первая работа: проверка стиля кода линтером
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      # Проверяем, что код отформатирован по правилам Black
      - name: Run Black code formatter check
        run: black --check .

      # Проверяем код на соответствие стандартам PEP 8 (исключения берутся из .flake8)
      - name: Run Flake8
        run: flake8 .

  # 2. Вторая работа: запуск тестов (начнется только после успешного линта)
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Запускаем ваши обновленные тесты с SQLite и InMemory кэшем
      - name: Run tests
        run: python manage.py test

  # 3. Третья работа: Сборка Docker-образа
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

  # 4. Четвертая работа: Деплой на ваш удаленный сервер
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Server via SSH
        run: |
          # Создаем временную директорию для ключа
          mkdir -p ~/.ssh
          
          # Записываем зашифрованный ключ во временный файл
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa_protected
          chmod 600 ~/.ssh/id_rsa_protected
          
          # Самый главный шаг: снимаем пароль с ключа прямо в памяти виртуальной машины,
          # используя сохраненный пароль из GitHub Secrets
          ssh-keygen -p -P "${{ secrets.SSH_PASSPHRASE }}" -N "" -f ~/.ssh/id_rsa_protected
          
          # Теперь подключаемся к серверу абсолютно стандартным и чистым ключом без пароля,
          # который выполнит команду за доли секунды и завершит сессию без зависаний
          ssh -T -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_protected ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} && \
            docker stop myapp || true && \
            docker rm myapp || true && \
            docker run -d --name myapp --env-file /home/${{ secrets.SSH_USER }}/.env -p 80:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} && \
            docker exec myapp python manage.py migrate --noinput
          "
