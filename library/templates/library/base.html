<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Управление библиотекой{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="#">Библиотека</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse"
            data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
            aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <li class="nav-item active">
                <a class="nav-link" href="{% url 'library:books_list' %}">Главная</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'library:authors_list' %}">Авторы</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'library:books_list' %}">Книги</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'library:books_create' %}">Добавить книгу</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'library:author_create' %}">Добавить автора</a>
            </li>
            {% if user.is_authenticated %}
            <li class="nav-item">
                <!-- Исправлено: выход через POST-форму для Django 6.x -->
                <form method="post" action="{% url 'users:logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="nav-link btn btn-link text-decoration-none" style="padding: 0; border: none; background: none; vertical-align: middle;">
                        Выйти ({{ user.username }})
                    </button>
                </form>
            </li>
            {% else %}
            <li class="nav-item">
                <a class="nav-link" href="{% url 'users:login' %}">Войти</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'users:register' %}">Регистрация</a>
            </li>
            {% endif %}
        </ul>
    </div>
</nav>
<div class="container mt-5">
    {% block content %}{% endblock %}
</div>
<script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
